[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prenatal-thalamus"
version = "1.0.0"
description = "Analysis code for: Thalamocortical constraints on areal connectivity in the developing human brain"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
